server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 15m            # idle timeout; the SPA calls /auth/refresh while the user is active
      cookie:
        name: IBSESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: internet-banking-bff
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5433/ib_app}
    username: ${APP_DB_USER:ib_app}
    password: ${APP_DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
fineract:
  base-url: ${FINERACT_BASE_URL:http://localhost:8443}
  tenant-id: ${FINERACT_TENANT_ID:default}
  username: ${FINERACT_USERNAME:mifos}
  password: ${FINERACT_PASSWORD:password}
app:
  max-failed-logins: 5
  lockout-minutes: 15
  bootstrap-admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
  bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  seed-demo-users: ${APP_SEED_DEMO_USERS:false}
  demo-user-password: ${DEMO_USER_PASSWORD:}
